name: Validate portfolio for GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild static site
        run: npm run build
      - name: Check committed Pages output is current
        run: git diff --exit-code -- index.html assets favicon.svg .nojekyll
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test the actual static Pages output
        run: npm test
